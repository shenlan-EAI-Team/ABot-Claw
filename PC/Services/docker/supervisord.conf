[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:yolo]
command=/opt/venvs/yolo/bin/python main.py
directory=/services/YOLO
environment=PORT="8013",DEVICE="auto",YOLO_MODEL_PATH="/services/YOLO/yolov5l6.pt",PYTHONPATH="/services/YOLO"
stdout_logfile=/var/log/supervisor/yolo-stdout.log
stderr_logfile=/var/log/supervisor/yolo-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
autorestart=true
startretries=3
priority=10

[program:face_recognition]
command=/opt/venvs/face/bin/python main.py
directory=/services/face_recognition_insightface
environment=PORT="8016",DEVICE="auto",FACE_DB_PATH="/services/face_recognition_insightface/data/face_db.json"
stdout_logfile=/var/log/supervisor/face-stdout.log
stderr_logfile=/var/log/supervisor/face-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
autorestart=true
startretries=3
priority=20

[program:spatial_memory]
command=/opt/venvs/spatial/bin/python main.py
directory=/services/SpatialMemory
environment=PORT="8022",MEMORY_HUB_DATA_DIR="/services/SpatialMemory/data",PYTHONPATH="/services/SpatialMemory"
stdout_logfile=/var/log/supervisor/spatial-stdout.log
stderr_logfile=/var/log/supervisor/spatial-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
autorestart=true
startretries=3
priority=30

[program:graspanything]
command=/opt/conda/envs/anygrasp/bin/python main.py
directory=/services/GraspAnything
environment=PORT="8015",DEVICE="auto",ANYGRASP_SDK_PATH="/services/GraspAnything/anygrasp_sdk",GRASP_CHECKPOINT_PATH="/services/GraspAnything/anygrasp_sdk/grasp_detection/log/checkpoint_detection.tar",GRASP_YOLO_MODEL_PATH="/services/YOLO/yolov5l6.pt"
stdout_logfile=/var/log/supervisor/grasp-stdout.log
stderr_logfile=/var/log/supervisor/grasp-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
autorestart=true
startretries=3
priority=40
